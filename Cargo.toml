[workspace]
resolver = "2"
members = [
    "crates/city-math",
    "crates/city-layout",
    "crates/city-sky",
    "crates/city-sim",
    "crates/city-avatar",
    "crates/city-camera",
    "crates/city-input",
    "crates/city-tex",
    "crates/city-mesh",
    "crates/city-hud",
    "crates/city-render",
    "crates/city-app",
    "crates/city-integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Neon Bay authors"]
repository = "local"

[workspace.dependencies]
city-math = { path = "crates/city-math" }
city-layout = { path = "crates/city-layout" }
city-sky = { path = "crates/city-sky" }
city-sim = { path = "crates/city-sim" }
city-avatar = { path = "crates/city-avatar" }
city-camera = { path = "crates/city-camera" }
city-input = { path = "crates/city-input" }
city-tex = { path = "crates/city-tex" }
city-mesh = { path = "crates/city-mesh" }
city-hud = { path = "crates/city-hud" }
city-render = { path = "crates/city-render" }
city-app = { path = "crates/city-app" }

wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlVertexArrayObject",
    "WebGlUniformLocation",
    "WebGlFramebuffer",
    "WebGlTexture",
    "WebGlSampler",
    "WebGlActiveInfo",
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "PointerEvent",
    "WebGlContextAttributes",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "EventTarget",
    "Event",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "PointerEvent",
    "console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
